name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  perl-tests:
    name: Perl Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.38"

      - name: Install cpanm
        run: cpan App::cpanminus

      - name: Install Perl dependencies
        run: cpanm --notest --installdeps .

      - name: Run Perl tests
        run: prove -l t/

  js-tests:
    name: JS / Karma Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Karma tests
        run: npm test

  deploy:
    name: Deploy to VPS
    needs: [perl-tests, js-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          rsync -az --delete \
            -e "ssh -i /tmp/deploy_key -p 22222 -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='public/mp3' \
            --exclude='database/' \
            ./ ${USER}@${HOST}:/home/seth/apps/badland/
          ssh -i /tmp/deploy_key -p 22222 -o StrictHostKeyChecking=no ${USER}@${HOST} \
            "cd /home/seth/apps/badland && \
             if [ -d public/packed ]; then find public/packed -maxdepth 1 -type f \( -name '_assetpack.map' -o -name 'style-*.min.css' -o -name 'app-*.min.js' -o -name 'badland-*.js' -o -name 'badland-*.css' \) -delete; fi && \
             docker compose build && \
             docker compose up -d --force-recreate app"
          rm /tmp/deploy_key
